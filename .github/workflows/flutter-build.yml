name: Build RustDesk Custom Client

on:
  workflow_call:
    inputs:
      upload-artifact:
        description: Upload build artifacts and publish the release
        type: boolean
        default: true
      upload-tag:
        description: Release tag
        type: string
        default: nightly
    secrets:
      RENDEZVOUS_SERVER:
        required: true
      RS_PUB_KEY:
        required: true

  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  CARGO_NDK_VERSION: "3.1.2"
  NDK_VERSION: "r28c"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  VERSION: "1.5.1"
  TAG_NAME: ${{ inputs.upload-tag || github.ref_name }}

jobs:
  generate-bridge:
    name: Generate Flutter bridge
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate bridge
        run: |
          echo "The upstream bridge workflow is required."
          echo "See .github/workflows/bridge.yml"

  build-windows:
    name: Windows AMD64 EXE and MSI
    runs-on: windows-2022

    steps:
      - name: Export Actions cache environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable(
              'ACTIONS_CACHE_URL',
              process.env.ACTIONS_CACHE_URL || ''
            );
            core.exportVariable(
              'ACTIONS_RUNTIME_TOKEN',
              process.env.ACTIONS_RUNTIME_TOKEN || ''
            );

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate custom server secrets
        shell: pwsh
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RENDEZVOUS_SERVER)) {
            throw "RENDEZVOUS_SERVER is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($env:RS_PUB_KEY)) {
            throw "RS_PUB_KEY is not configured."
          }

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Patch Flutter
        shell: bash
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          cd "$FLUTTER_ROOT"
          git apply \
            "${GITHUB_WORKSPACE}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Configure custom server
        shell: pwsh
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $files = Get-ChildItem -Path . -Recurse -File |
            Where-Object {
              $_.Name -eq "config.rs" -and
              $_.FullName -match 'hbb_common'
            }

          if (-not $files) {
            throw "Could not locate the upstream hbb_common config.rs. Review the current RustDesk source layout and default server configuration before building."
          }

          foreach ($file in $files) {
            $content = Get-Content $file.FullName -Raw

            $serverPattern = '(?m)^(\s*pub\s+const\s+DEFAULT_RENDEZVOUS_SERVER\s*:\s*&str\s*=\s*)"[^"]*"'
            $keyPattern = '(?m)^(\s*pub\s+const\s+DEFAULT_RS_PUB_KEY\s*:\s*&str\s*=\s*)"[^"]*"'

            if ($content -match $serverPattern) {
              $server = $env:RENDEZVOUS_SERVER.Replace('\', '\\').Replace('"', '\"')
              $content = [regex]::Replace(
                $content,
                $serverPattern,
                [System.Text.RegularExpressions.MatchEvaluator]{
                  param($m)
                  return $m.Groups[1].Value + '"' + $server + '"'
                }
              )
            }

            if ($content -match $keyPattern) {
              $key = $env:RS_PUB_KEY.Replace('\', '\\').Replace('"', '\"')
              $content = [regex]::Replace(
                $content,
                $keyPattern,
                [System.Text.RegularExpressions.MatchEvaluator]{
                  param($m)
                  return $m.Groups[1].Value + '"' + $key + '"'
                }
              )
            }

            Set-Content -Path $file.FullName -Value $content -Encoding utf8
          }

      - name: Build RustDesk
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          python -m pip install requests

          python .\build.py `
            --portable `
            --flutter `
            --skip-portable-pack `
            --hwcodec --vram

          if ($LASTEXITCODE -ne 0) {
            throw "RustDesk Windows build failed."
          }

      - name: Package portable EXE
        if: inputs.upload-artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $release = ".\flutter\build\windows\x64\runner\Release"
          if (-not (Test-Path $release)) {
            throw "Windows release directory not found: $release"
          }

          New-Item -ItemType Directory -Force -Path ".\SignOutput" | Out-Null

          python -m pip install -r .\libs\portable\requirements.txt

          Push-Location .\libs\portable
          python .\generate.py `
            -f ..\..\flutter\build\windows\x64\runner\Release `
            -o . `
            -e ..\..\flutter\build\windows\x64\runner\Release\rustdesk.exe
          Pop-Location

          $portable = ".\target\release\rustdesk-portable-packer.exe"
          if (-not (Test-Path $portable)) {
            throw "Portable EXE was not generated."
          }

          Copy-Item $portable ".\SignOutput\rustdesk-windows-x86_64-portable.exe"

      - name: Build MSI
        if: inputs.upload-artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Push-Location .\res\msi
          python .\preprocess.py --arp -d ..\..\flutter\build\windows\x64\runner\Release
          nuget restore .\msi.sln

          msbuild .\msi.sln `
            -p:Configuration=Release `
            -p:Platform=x64 `
            /p:TargetVersion=Windows10

          if ($LASTEXITCODE -ne 0) {
            throw "MSI build failed."
          }

          $msi = Get-ChildItem .\Package\bin\*\Release\en-us\Package.msi |
            Select-Object -First 1

          if (-not $msi) {
            throw "MSI package not found."
          }

          Pop-Location

          Copy-Item $msi.FullName ".\SignOutput\rustdesk-windows-x86_64.msi"

      - name: Upload Windows artifacts
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-amd64
          path: |
            SignOutput/rustdesk-windows-x86_64-portable.exe
            SignOutput/rustdesk-windows-x86_64.msi
          if-no-files-found: error

      - name: Publish Windows packages
        if: inputs.upload-artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          prerelease: true
          files: |
            SignOutput/rustdesk-windows-x86_64-portable.exe
            SignOutput/rustdesk-windows-x86_64.msi

  build-linux:
    name: Linux AMD64 DEB
    runs-on: ubuntu-22.04

    steps:
      - name: Export Actions cache environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable(
              'ACTIONS_CACHE_URL',
              process.env.ACTIONS_CACHE_URL || ''
            );
            core.exportVariable(
              'ACTIONS_RUNTIME_TOKEN',
              process.env.ACTIONS_RUNTIME_TOKEN || ''
            );

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate custom server secrets
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          test -n "$RENDEZVOUS_SERVER" || {
            echo "::error::RENDEZVOUS_SERVER is not configured"
            exit 1
          }

          test -n "$RS_PUB_KEY" || {
            echo "::error::RS_PUB_KEY is not configured"
            exit 1
          }

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            gcc \
            g++ \
            git \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libclang-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpulse-dev \
            libva-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            nasm \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            rpm \
            unzip \
            wget \
            xz-utils \
            libssl-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch Flutter
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          cd "$FLUTTER_ROOT"
          git apply \
            "${GITHUB_WORKSPACE}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Configure custom server
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          server = os.environ["RENDEZVOUS_SERVER"]
          key = os.environ["RS_PUB_KEY"]

          candidates = list(pathlib.Path(".").rglob("config.rs"))
          candidates = [
              p for p in candidates
              if "hbb_common" in str(p).replace("\\", "/")
          ]

          if not candidates:
              sys.exit(
                  "Could not locate hbb_common config.rs; "
                  "review the upstream source layout."
              )

          replacements = {
              "DEFAULT_RENDEZVOUS_SERVER": server,
              "DEFAULT_RS_PUB_KEY": key,
          }

          for path in candidates:
              content = path.read_text(encoding="utf-8")
              for name, value in replacements.items():
                  pattern = (
                      r'(?m)^(\s*pub\s+const\s+'
                      + re.escape(name)
                      + r'\s*:\s*&str\s*=\s*)"[^"]*"'
                  )
                  if re.search(pattern, content):
                      content = re.sub(
                          pattern,
                          lambda m: (
                              m.group(1)
                              + '"'
                              + value.replace("\\", "\\\\")
                                     .replace('"', '\\"')
                              + '"'
                          ),
                          content,
                      )
              path.write_text(content, encoding="utf-8")
          PY

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          sudo apt-get install -y libva-dev

          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-linux \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Build RustDesk Linux
        env:
          VCPKG_ROOT: /opt/artifacts/vcpkg
          CARGO_INCREMENTAL: "0"
        run: |
          python3 ./res/inline-sciter.py

          cargo build \
            --locked \
            --features inline \
            --release \
            --bins \
            --jobs 2

          mkdir -p Release
          cp target/release/rustdesk Release/rustdesk

          wget -O Release/libsciter-gtk.so \
            https://github.com/c-smile/sciter-sdk/raw/master/bin.lnx/x64/libsciter-gtk.so

          export DEB_ARCH=amd64
          python3 ./build.py --package ./Release

      - name: Locate DEB package
        run: |
          set -euo pipefail

          mkdir -p dist

          deb="$(find . -maxdepth 2 -type f -name 'rustdesk*.deb' \
            ! -path './dist/*' | head -n 1)"

          if [ -z "$deb" ]; then
            echo "::error::DEB package was not generated."
            exit 1
          fi

          cp "$deb" dist/rustdesk-linux-amd64.deb

      - name: Upload Linux DEB
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux-amd64-deb
          path: dist/rustdesk-linux-amd64.deb
          if-no-files-found: error

      - name: Publish Linux DEB
        if: inputs.upload-artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          prerelease: true
          files: dist/rustdesk-linux-amd64.deb

  build-appimage:
    name: Linux AMD64 AppImage
    runs-on: ubuntu-22.04
    needs: build-linux
    if: inputs.upload-artifact

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download DEB artifact
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-linux-amd64-deb
          path: dist

      - name: Prepare AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2
          python3 -m pip install --user "setuptools_scm<10"
          python3 -m pip install --user \
            git+https://github.com/rustdesk-org/appimage-builder.git

      - name: Build AppImage
        run: |
          set -euo pipefail

          cp dist/rustdesk-linux-amd64.deb appimage/rustdesk.deb

          cd appimage
          ./build-apprun.sh x86_64
          "$HOME/.local/bin/appimage-builder" \
            --skip-tests \
            --recipe ./AppImageBuilder-x86_64.yml

          appimage="$(find . -maxdepth 2 -type f -name '*.AppImage' | head -n 1)"

          if [ -z "$appimage" ]; then
            echo "::error::AppImage was not generated."
            exit 1
          fi

          mkdir -p ../dist-appimage
          cp "$appimage" ../dist-appimage/rustdesk-linux-amd64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux-amd64-appimage
          path: dist-appimage/rustdesk-linux-amd64.AppImage
          if-no-files-found: error

      - name: Publish AppImage
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          prerelease: true
          files: dist-appimage/rustdesk-linux-amd64.AppImage

  build-android:
    name: Android ARMv8 APK
    runs-on: ubuntu-24.04

    steps:
      - name: Export Actions cache environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable(
              'ACTIONS_CACHE_URL',
              process.env.ACTIONS_CACHE_URL || ''
            );
            core.exportVariable(
              'ACTIONS_RUNTIME_TOKEN',
              process.env.ACTIONS_RUNTIME_TOKEN || ''
            );

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate custom server secrets
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          test -n "$RENDEZVOUS_SERVER" || {
            echo "::error::RENDEZVOUS_SERVER is not configured"
            exit 1
          }

          test -n "$RS_PUB_KEY" || {
            echo "::error::RS_PUB_KEY is not configured"
            exit 1
          }

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            git \
            g++ \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libclang-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpulse-dev \
            libva-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            llvm \
            nasm \
            ninja-build \
            openjdk-17-jdk-headless \
            pkg-config \
            wget

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch Flutter
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          cd "$FLUTTER_ROOT"
          git apply \
            "${GITHUB_WORKSPACE}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
          components: rustfmt

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Configure custom server
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          server = os.environ["RENDEZVOUS_SERVER"]
          key = os.environ["RS_PUB_KEY"]

          candidates = [
              p for p in pathlib.Path(".").rglob("config.rs")
              if "hbb_common" in str(p).replace("\\", "/")
          ]

          if not candidates:
              sys.exit(
                  "Could not locate hbb_common config.rs; "
                  "review the upstream source layout."
              )

          for path in candidates:
              content = path.read_text(encoding="utf-8")
              for name, value in {
                  "DEFAULT_RENDEZVOUS_SERVER": server,
                  "DEFAULT_RS_PUB_KEY": key,
              }.items():
                  pattern = (
                      r'(?m)^(\s*pub\s+const\s+'
                      + re.escape(name)
                      + r'\s*:\s*&str\s*=\s*)"[^"]*"'
                  )
                  if re.search(pattern, content):
                      content = re.sub(
                          pattern,
                          lambda m: (
                              m.group(1)
                              + '"'
                              + value.replace("\\", "\\\\")
                                     .replace('"', '\\"')
                              + '"'
                          ),
                          content,
                      )
              path.write_text(content, encoding="utf-8")
          PY

      - name: Install Android build dependencies
        run: |
          ./flutter/build_android_deps.sh arm64-v8a

      - name: Build RustDesk Android native library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_ROOT: /opt/artifacts/vcpkg
        run: |
          cargo install cargo-ndk \
            --version "${CARGO_NDK_VERSION}" \
            --locked

          ./flutter/ndk_arm64.sh

          cargo ndk \
            -t arm64-v8a \
            -o ./flutter/android/app/src/main/jniLibs \
            build --release --features flutter,hwcodec

      - name: Build Android APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"

          sed -i \
            's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g' \
            ./flutter/android/gradle.properties

          cd flutter
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Stage APK
        run: |
          set -euo pipefail

          mkdir -p dist

          apk="$(find flutter/build/app/outputs/flutter-apk \
            -maxdepth 1 -type f -name '*arm64-v8a*.apk' | head -n 1)"

          if [ -z "$apk" ]; then
            apk="$(find flutter/build/app/outputs/flutter-apk \
              -maxdepth 1 -type f -name 'app-release.apk' | head -n 1)"
          fi

          if [ -z "$apk" ]; then
            echo "::error::Android ARM64 APK was not generated."
            exit 1
          fi

          cp "$apk" dist/rustdesk-android-armv8.apk

      - name: Upload Android APK
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-android-armv8
          path: dist/rustdesk-android-armv8.apk
          if-no-files-found: error

      - name: Publish Android APK
        if: inputs.upload-artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          prerelease: true
          files: dist/rustdesk-android-armv8.apk
